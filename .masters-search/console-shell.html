<meta charset="utf-8">
<title>The Console — your master's search, decided</title>
<style>
:root{
  --ground:#F2F5F5; --surface:#FFFFFF; --raised:#F8FAFA; --sunk:#ECF1F1;
  --ink:#0C1416; --ink-2:#3A494C; --muted:#68797C;
  --line:#D9E2E2; --line-2:#E9EFEF;
  --accent:#0A6B74; --accent-soft:#DFEEEF; --accent-ink:#05545C;
  --ok:#2A7A4B; --ok-bg:#E1F1E8; --ok-line:#B6DCC6;
  --warn:#95630F; --warn-bg:#F9EDD8; --warn-line:#E7D0A3;
  --bad:#A32F28; --bad-bg:#F9E5E3; --bad-line:#EDC2BD;
  --gold:#8A6A17;
  --sh-1:0 1px 2px rgba(12,20,22,.05);
  --sh-2:0 2px 4px rgba(12,20,22,.06), 0 12px 28px -14px rgba(12,20,22,.22);
  --sh-3:0 4px 8px rgba(12,20,22,.08), 0 24px 60px -20px rgba(12,20,22,.34);
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1113; --surface:#131C1F; --raised:#182226; --sunk:#0E1719;
    --ink:#E9F0F1; --ink-2:#B4C4C6; --muted:#87989B;
    --line:#222F31; --line-2:#1B2628;
    --accent:#46C6CF; --accent-soft:#102C30; --accent-ink:#8FE0E6;
    --ok:#63C48B; --ok-bg:#10281C; --ok-line:#1E4632;
    --warn:#D9A550; --warn-bg:#2B2110; --warn-line:#4A3A18;
    --bad:#E77A72; --bad-bg:#2D1513; --bad-line:#4E2622;
    --gold:#D3AE5B;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 2px 6px rgba(0,0,0,.45), 0 14px 32px -16px rgba(0,0,0,.75);
    --sh-3:0 6px 14px rgba(0,0,0,.5), 0 30px 70px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1113; --surface:#131C1F; --raised:#182226; --sunk:#0E1719;
  --ink:#E9F0F1; --ink-2:#B4C4C6; --muted:#87989B;
  --line:#222F31; --line-2:#1B2628;
  --accent:#46C6CF; --accent-soft:#102C30; --accent-ink:#8FE0E6;
  --ok:#63C48B; --ok-bg:#10281C; --ok-line:#1E4632;
  --warn:#D9A550; --warn-bg:#2B2110; --warn-line:#4A3A18;
  --bad:#E77A72; --bad-bg:#2D1513; --bad-line:#4E2622;
  --gold:#D3AE5B;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.45), 0 14px 32px -16px rgba(0,0,0,.75);
  --sh-3:0 6px 14px rgba(0,0,0,.5), 0 30px 70px -24px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto}}
.lbl{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ============ header ============ */
.top{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line)}
.top-in{max-width:1500px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
.mark{display:flex; align-items:baseline; gap:9px; flex:none}
.mark h1{font-size:19px}
.mark span{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
@media (max-width:700px){ .mark span{display:none} }

.modes{display:flex; gap:2px; background:var(--sunk); padding:3px; border-radius:5px; flex:none}
.mode{border:none; background:none; padding:6px 13px; border-radius:3px; cursor:pointer;
  font-size:13.5px; color:var(--muted); display:flex; align-items:center; gap:6px}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--sh-1)}
.mode .b{font-family:var(--mono); font-size:10.5px; background:var(--accent); color:var(--surface);
  border-radius:9px; padding:1px 6px; min-width:18px; text-align:center}
.mode[aria-selected="true"] .b{background:var(--accent)}

.srch{position:relative; flex:1 1 220px; max-width:400px; margin-left:auto}
.srch svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted)}
#q{width:100%; padding:8px 30px 8px 32px; font:inherit; font-size:13.5px; color:var(--ink);
  background:var(--raised); border:1px solid var(--line); border-radius:var(--r)}
#q::placeholder{color:var(--muted)}
.kbd{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-family:var(--mono);
  font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:1px 4px; background:var(--surface)}
.icb{flex:none; background:var(--raised); border:1px solid var(--line); color:var(--ink-2);
  border-radius:var(--r); width:33px; height:33px; cursor:pointer; display:grid; place-items:center; font-size:14px}
.icb:hover{border-color:var(--accent); color:var(--accent-ink)}
@media (max-width:640px){ .modes .t{display:none} .mode{padding:6px 9px} }

/* ============ shared ============ */
.page{max-width:1500px; margin:0 auto; padding:22px 20px 80px}
.meter{display:inline-flex; gap:2px; align-items:flex-end; height:14px; flex:none; vertical-align:-2px}
.meter i{width:3.5px; border-radius:1px; background:var(--line-2); display:block}
.meter i:nth-child(1){height:6px} .meter i:nth-child(2){height:10px} .meter i:nth-child(3){height:14px}
.m-Strong i{background:var(--ok)}
.m-Possible i:nth-child(1),.m-Possible i:nth-child(2){background:var(--warn)}
.m-Weak i:nth-child(1){background:var(--bad)}
.chip{display:inline-block; font-family:var(--mono); font-size:10.5px; padding:3px 7px; border-radius:3px;
  border:1px solid transparent; white-space:nowrap}
.c-free{background:var(--ok-bg); color:var(--ok); border-color:var(--ok-line)}
.c-mid{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-line)}
.c-high{background:var(--bad-bg); color:var(--bad); border-color:var(--bad-line)}
.c-unk{background:var(--sunk); color:var(--muted); border-color:var(--line-2)}
.c-plain{background:var(--sunk); color:var(--ink-2); border-color:var(--line-2)}
.star{background:none; border:none; cursor:pointer; color:var(--line); padding:3px; line-height:1;
  font-size:17px; flex:none; transition:color .12s, transform .12s}
.star:hover{color:var(--gold); transform:scale(1.14)}
.star.on{color:var(--gold)}

/* ============ PICKS ============ */
.hero{margin-bottom:26px; max-width:64ch}
.hero .eyebrow{margin-bottom:9px}
.hero h2{font-size:clamp(25px,3.6vw,34px); line-height:1.12; margin-bottom:11px}
.hero p{color:var(--ink-2); font-size:15.5px}
.hero em{color:var(--ink); font-style:normal; font-weight:600}
.next{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 18px; margin:22px 0 30px; box-shadow:var(--sh-1)}
.next h3{font-size:14px; margin-bottom:11px}
.next ol{margin:0; padding-left:19px; display:grid; gap:8px; font-size:14px; color:var(--ink-2)}
.next li::marker{color:var(--accent); font-family:var(--mono); font-size:12px}
.next b{color:var(--ink)}

.sechead{display:flex; align-items:baseline; gap:11px; margin:30px 0 13px; flex-wrap:wrap}
.sechead h3{font-size:19px}
.sechead p{font-size:13.5px; color:var(--muted); flex:1 1 240px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:13px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px;
  cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:9px; box-shadow:var(--sh-1);
  transition:box-shadow .15s, border-color .15s, transform .15s}
.card:hover{box-shadow:var(--sh-2); border-color:var(--accent); transform:translateY(-1px)}
.card .ctop{display:flex; align-items:flex-start; gap:9px}
.card h4{font-size:15.5px; line-height:1.3; flex:1; font-family:var(--sans); font-weight:650;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.card .cwhere{display:block; font-size:12.5px; color:var(--muted); margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .cchips{display:flex; gap:5px; flex-wrap:wrap}
.card .cwhy{font-size:13px; color:var(--ink-2); line-height:1.48;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.card .cfoot{display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:9px; border-top:1px solid var(--line-2)}
.card .cdl{font-family:var(--mono); font-size:10.5px; color:var(--muted); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.rk{font-family:var(--mono); font-size:10px; font-weight:700; width:19px; height:19px; border-radius:3px;
  display:grid; place-items:center; flex:none}
.rk-A{background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-line)}
.rk-B{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-line)}

/* ============ EXPLORE ============ */
.exp{display:grid; grid-template-columns:236px 1fr; gap:20px; align-items:start}
@media (max-width:980px){
  .exp{grid-template-columns:1fr}
  .rail{position:fixed!important; inset:0; z-index:70; background:var(--surface); padding:16px 18px 80px;
    overflow-y:auto; max-height:none!important; transform:translateX(-100%); transition:transform .2s}
  .rail.open{transform:none}
  .railclose{display:grid!important}
  .fabfilter{display:flex!important}
}
.rail{position:sticky; top:66px; max-height:calc(100vh - 88px); overflow-y:auto; padding-right:6px}
.railclose{display:none; position:sticky; top:0; margin:-16px -18px 10px; padding:12px 18px;
  background:var(--surface); border-bottom:1px solid var(--line); place-items:center; grid-auto-flow:column; gap:10px}
.fabfilter{display:none; position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:50;
  background:var(--ink); color:var(--ground); border:none; border-radius:22px; padding:11px 20px;
  cursor:pointer; box-shadow:var(--sh-3); font-size:14px; gap:8px; align-items:center}
.fg{border-top:1px solid var(--line-2); padding:11px 0 2px}
.fg:first-child{border-top:none; padding-top:0}
.fg h3{font-size:10px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:600; margin-bottom:6px}
.opt{display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; font-size:13.5px; color:var(--ink-2)}
.opt:hover{color:var(--ink)}
.opt input{accent-color:var(--accent); width:14px; height:14px; margin:0; flex:none}
.opt .n{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.opt.on{color:var(--ink); font-weight:600}
.opt.zero{opacity:.36}
.fmore{background:none; border:none; padding:3px 0; font-size:12.5px; color:var(--accent-ink); cursor:pointer}

.results{min-width:0}
.qv{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.qv .lbl{margin-right:2px}
.qvb{border:1px solid var(--line); background:var(--surface); color:var(--ink-2); border-radius:18px;
  padding:6px 13px; font-size:13px; cursor:pointer}
.qvb:hover{border-color:var(--accent); color:var(--accent-ink)}
.qvb[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
:root[data-theme="dark"] .qvb[aria-pressed="true"],
:root:not([data-theme="light"]) .qvb[aria-pressed="true"]{color:#06181A}
.legend{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 15px; margin-bottom:13px; font-size:13px; color:var(--ink-2)}
.legend summary{cursor:pointer; color:var(--accent-ink); font-weight:600; font-size:13px}
.legend .lg{display:grid; gap:7px; margin-top:11px}
.legend .lg div{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap}
.legend b{color:var(--ink)}
.rbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:11px}
.rbar .cnt{font-size:14px; color:var(--ink-2)}
.rbar .cnt b{font-family:var(--mono); font-size:19px; color:var(--ink); font-variant-numeric:tabular-nums}
select{font:inherit; font-size:13px; padding:6px 8px; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:var(--r)}
.active{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:11px}
.afc{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-ink);
  border:1px solid var(--accent); border-radius:20px; padding:3px 6px 3px 11px; font-size:12.5px}
.afc button{background:none; border:none; cursor:pointer; color:inherit; font-size:14px; line-height:1;
  width:17px; height:17px; border-radius:50%; opacity:.65}
.afc button:hover{opacity:1; background:rgba(0,0,0,.08)}
.clearall{background:none; border:1px dashed var(--line); border-radius:20px; padding:3px 11px;
  font-size:12.5px; color:var(--muted); cursor:pointer}
.clearall:hover{border-color:var(--accent); color:var(--accent-ink)}

.list{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--sh-1)}
.row{display:grid; grid-template-columns:20px minmax(0,1fr) 118px 108px 96px 30px; gap:13px; align-items:center;
  width:100%; text-align:left; padding:10px 13px; background:none; border:none;
  border-top:1px solid var(--line-2); cursor:pointer}
.row:first-child{border-top:none}
.row:hover,.row.cursor{background:var(--raised)}
.row.cursor{box-shadow:inset 2px 0 0 var(--accent)}
.row>*{min-width:0}
.rmain{display:block; min-width:0}
.rinst{display:block; font-weight:650; font-size:13.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rprog{display:block; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px}
.rwhere{display:block; font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rwhere small{display:block; color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis}
.rlang{display:block; font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rlang.sp{color:var(--accent-ink); font-weight:600}
@media (max-width:820px){
  .row{grid-template-columns:20px minmax(0,1fr) 92px 30px}
  .rwhere,.rlang{display:none}
}
.more{width:100%; padding:12px; background:var(--raised); border:none; border-top:1px solid var(--line);
  cursor:pointer; font-size:13.5px; color:var(--accent-ink)}
.more:hover{background:var(--accent-soft)}
.empty{padding:52px 20px; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:5px; font-family:var(--serif)}

/* ============ SHORTLIST ============ */
.cmp{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh-1)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line-2); vertical-align:top}
thead th{position:sticky; top:0; background:var(--sunk); font-family:var(--mono); font-size:10px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap; z-index:1}
tbody tr:hover{background:var(--raised)}
td.tinst{font-weight:650; color:var(--ink); min-width:200px}
td.tinst small{display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:2px}
.rmv{background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px}
.rmv:hover{color:var(--bad)}

/* ============ detail panel ============ */
.scrim{position:fixed; inset:0; background:rgba(6,12,13,.52); z-index:80; opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.open{opacity:1; pointer-events:auto}
.panel{position:fixed; top:0; right:0; height:100%; width:min(640px,100%); z-index:90; background:var(--surface);
  border-left:1px solid var(--line); box-shadow:var(--sh-3); transform:translateX(100%);
  transition:transform .22s cubic-bezier(.32,.72,0,1); display:flex; flex-direction:column}
.panel.open{transform:none}
.phead{padding:18px 22px 15px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:flex-start}
.phead h2{font-size:18px; line-height:1.25; font-family:var(--sans); font-weight:650}
.phead .pw{font-size:13px; color:var(--muted); margin-top:4px}
.pnav{margin-left:auto; display:flex; gap:5px; flex:none}
.pbody{overflow-y:auto; padding:0 22px 44px}
.pstat{display:flex; gap:6px; flex-wrap:wrap; padding:15px 0; border-bottom:1px solid var(--line-2)}
.pgrp{padding:15px 0 4px; border-bottom:1px solid var(--line-2)}
.pgrp:last-of-type{border-bottom:none}
.pgrp>h4{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent-ink); margin-bottom:9px}
.fld{margin-bottom:11px}
.fld dt{font-size:11.5px; color:var(--muted); margin-bottom:2px; font-weight:600}
.fld dd{margin:0; font-size:13.5px; color:var(--ink-2); line-height:1.55}
.fld.hi dd{color:var(--ink)}
.plink{display:inline-block; margin:16px 0 4px; font-size:13px; padding:9px 14px; background:var(--accent);
  color:#fff; border-radius:var(--r); text-decoration:none; font-weight:600}
:root[data-theme="dark"] .plink, :root:not([data-theme="light"]) .plink{color:#06181A}
.plink:hover{filter:brightness(1.08)}

.toast{position:fixed; bottom:20px; left:50%; transform:translate(-50%,80px); z-index:100;
  background:var(--ink); color:var(--ground); padding:10px 17px; border-radius:20px; font-size:13.5px;
  box-shadow:var(--sh-3); opacity:0; transition:transform .22s, opacity .22s; pointer-events:none}
.toast.on{transform:translate(-50%,0); opacity:1}
</style>

<header class="top">
  <div class="top-in">
    <div class="mark"><h1>The Console</h1><span id="hcount">1,091 programmes</span></div>
    <div class="modes" role="tablist">
      <button class="mode" role="tab" data-mode="picks" aria-selected="true"><span class="t">Picks</span></button>
      <button class="mode" role="tab" data-mode="explore" aria-selected="false"><span class="t">Explore</span></button>
      <button class="mode" role="tab" data-mode="saved" aria-selected="false"><span class="t">Shortlist</span> <span class="b" id="savedN">0</span></button>
    </div>
    <div class="srch">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Search 1,091 programmes…" autocomplete="off">
      <span class="kbd">/</span>
    </div>
    <button class="icb" id="theme" type="button" aria-label="Switch light or dark">◐</button>
  </div>
</header>

<main class="page">
  <section id="v-picks"></section>
  <section id="v-explore" hidden></section>
  <section id="v-saved" hidden></section>
</main>

<button class="fabfilter" id="fab" type="button" hidden>Filters <span class="num" id="fabN"></span></button>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const RAW = JSON.parse(document.getElementById('data').textContent);
RAW.forEach((r,i)=>r.id=i);

const CHANCE=['Strong','Possible','Weak'];
const COSTS=['Free','Under EUR 1.5k/yr','EUR 1.5k-5k/yr','EUR 5k-15k/yr','Over EUR 15k/yr','Not published'];
const COST_RANK=Object.fromEntries(COSTS.map((c,i)=>[c,i]));
const CH_RANK={Strong:0,Possible:1,Weak:2};
const CHEAP=new Set(['Free','Under EUR 1.5k/yr','EUR 1.5k-5k/yr']);
const speaks=l=>l.startsWith('English')||l.includes('French');
const esc=s=>(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const costClass=c=>CHEAP.has(c)?'c-free':c==='EUR 5k-15k/yr'?'c-mid':c==='Over EUR 15k/yr'?'c-high':'c-unk';
/* pt = programme name with verification prose stripped; dls = a deadline only when it
   actually contains a date. Both are prepared in the export, not guessed here. */
const NAME=r=>r.pt||r.p;

/* ---------- saved shortlist, persisted ---------- */
const SKEY='console.saved.v1';
let saved = new Set(JSON.parse(localStorage.getItem(SKEY) || '[]'));
const keyOf = r => r.i + '||' + r.p;
function isSaved(r){ return saved.has(keyOf(r)); }
function toggleSave(r){
  const k = keyOf(r);
  saved.has(k) ? saved.delete(k) : saved.add(k);
  localStorage.setItem(SKEY, JSON.stringify([...saved]));
  document.getElementById('savedN').textContent = saved.size;
  document.querySelectorAll(`[data-star="${CSS.escape(String(r.id))}"]`).forEach(b=>b.classList.toggle('on', saved.has(k)));
  toast(saved.has(k) ? 'Added to your shortlist' : 'Removed from shortlist');
  if (mode==='saved') renderSaved();
}
let tt;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),1900); }

/* ---------- state ---------- */
const FILTERS=[
  {k:'ch',t:'Your chance',order:CHANCE},{k:'cb',t:'What you pay',order:COSTS},
  {k:'lg',t:'Taught in'},{k:'pp',t:'Public or private'},{k:'fu',t:'Funding'},
  {k:'vd',t:'Verified verdict'},{k:'rg',t:'Region'},{k:'c',t:'Country'},{k:'tr',t:'Subject'},
];
const active={}; FILTERS.forEach(f=>active[f.k]=new Set());
let query='', sortBy='best', shown=50, mode='picks', cursor=-1, expanded={}, qv='', legendOpen=false;
const QV=[
  {k:'best',  t:'Best bets',        f:()=>{active.ch=new Set(['Strong']); active.cb=new Set(['Free','Under EUR 1.5k/yr','EUR 1.5k-5k/yr']);}},
  {k:'worth', t:'Verified worth it',f:()=>{active.vd=new Set(['WORTH IT']);}},
  {k:'funded',t:'Fully funded',     f:()=>{active.fu=new Set(['Full']);}},
  {k:'speak', t:'English or French', f:()=>{active.lg=new Set([...new Set(RAW.map(r=>r.lg))].filter(speaks));}},
  {k:'free',  t:'Free or near-free', f:()=>{active.cb=new Set(['Free','Under EUR 1.5k/yr']);}},
  {k:'avoid', t:'The avoid list',   f:()=>{active.vd=new Set(['AVOID']);}},
];

/* ---------- url state so a view can be shared or bookmarked ---------- */
function writeURL(){
  const p=new URLSearchParams();
  if(mode!=='picks') p.set('m',mode);
  if(query) p.set('q',query);
  FILTERS.forEach(f=>{ if(active[f.k].size) p.set(f.k,[...active[f.k]].join('~')); });
  if(sortBy!=='best') p.set('s',sortBy);
  history.replaceState(null,'', p.toString()? '?'+p : location.pathname);
}
function readURL(){
  const p=new URLSearchParams(location.search);
  mode=p.get('m')||'picks'; query=p.get('q')||''; sortBy=p.get('s')||'best';
  FILTERS.forEach(f=>{ const v=p.get(f.k); if(v) active[f.k]=new Set(v.split('~')); });
  if(query) document.getElementById('q').value=query;
}

/* ---------- filtering ---------- */
function matches(r, skip){
  if(query){
    const hay=(r.i+' '+r.p+' '+r.c+' '+r.ct+' '+r.sch+' '+r.tr).toLowerCase();
    if(!query.split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  for(const f of FILTERS){
    if(f.k===skip) continue;
    const s=active[f.k];
    if(s.size && !s.has(r[f.k]||'—')) return false;
  }
  return true;
}
const sorters={
  best:(a,b)=>(CH_RANK[a.ch]-CH_RANK[b.ch])||((COST_RANK[a.cb]??9)-(COST_RANK[b.cb]??9))||a.i.localeCompare(b.i),
  cost:(a,b)=>((COST_RANK[a.cb]??9)-(COST_RANK[b.cb]??9))||(CH_RANK[a.ch]-CH_RANK[b.ch]),
  country:(a,b)=>a.c.localeCompare(b.c)||a.i.localeCompare(b.i),
  inst:(a,b)=>a.i.localeCompare(b.i),
};
let current=[];

/* ================= PICKS ================= */

const BEST  = RAW.filter(r=>r.ch==='Strong' && CHEAP.has(r.cb));

/* ================= EXPLORE ================= */
function renderRail(){
  const host=document.getElementById('rail'); if(!host) return;
  host.innerHTML=`<div class="railclose"><b>Filters</b><button class="icb" id="railX" type="button">×</button></div>`+
  FILTERS.map(f=>{
    const counts={};
    RAW.filter(r=>matches(r,f.k)).forEach(r=>{const v=r[f.k]||'—'; counts[v]=(counts[v]||0)+1;});
    const all={}; RAW.forEach(r=>{const v=r[f.k]||'—'; all[v]=(all[v]||0)+1;});
    let vals=Object.keys(all);
    vals.sort(f.order?(a,b)=>f.order.indexOf(a)-f.order.indexOf(b):(a,b)=>(counts[b]||0)-(counts[a]||0)||a.localeCompare(b));
    const lim=expanded[f.k]?vals.length:(f.order?vals.length:8);
    const head=vals.slice(0,lim);
    return `<div class="fg"><h3>${esc(f.t)}</h3>`+head.map(v=>{
      const n=counts[v]||0;
      return `<label class="opt ${active[f.k].has(v)?'on':''} ${n?'':'zero'}" data-k="${f.k}" data-v="${esc(v)}">
        <input type="checkbox" ${active[f.k].has(v)?'checked':''}><span>${esc(v==='—'?'not stated':v)}</span><span class="n">${n}</span></label>`;
    }).join('')+(vals.length>lim?`<button class="fmore" data-exp="${f.k}" type="button">+ ${vals.length-lim} more</button>`:'')+`</div>`;
  }).join('');
}
function activeChips(){
  const out=[];
  FILTERS.forEach(f=>[...active[f.k]].forEach(v=>
    out.push(`<span class="afc">${esc(v==='—'?f.t+': not stated':v)}<button data-rm-k="${f.k}" data-rm-v="${esc(v)}" aria-label="Remove filter">×</button></span>`)));
  if(query) out.push(`<span class="afc">“${esc(query)}”<button data-rm-q="1" aria-label="Clear search">×</button></span>`);
  return out.length ? `<div class="active">${out.join('')}<button class="clearall" id="clr" type="button">Clear all</button></div>` : '';
}
function rowHTML(r,i){
  return `<button class="row ${i===cursor?'cursor':''}" data-id="${r.id}" type="button">

  </button>`;
}

          <span class="chip c-mid">EUR 5k-15k/yr</span> <span class="chip c-high">Over EUR 15k/yr</span>
          <span>— <b>tuition per year</b>, at the rate <b>you</b> pay as a non-EU national. Where a school

        <div><span class="chip c-unk">Not published</span> <span>— the institution publishes no figure. Not the same as free.</span></div>

/* ================= SHORTLIST ================= */
function savedRows(){ return RAW.filter(isSaved); }
function renderSaved(){
  const rows=savedRows();
  document.getElementById('savedN').textContent=saved.size;

/* ================= detail panel ================= */
const panel=document.getElementById('panel'), scrim=document.getElementById('scrim');
let lastFocus=null, panelList=[], panelPos=-1;
function openId(id, list){
  panelList = list || current.length ? (list||current) : RAW;
  panelPos = panelList.findIndex(r=>r.id===id);
  drawPanel(RAW[id]);
}
function drawPanel(r){
  const F=(l,v,hi)=>v?`<div class="fld ${hi?'hi':''}"><dt>${l}</dt><dd>${esc(v)}</dd></div>`:'';
  const G=(t,body)=>body.trim()?`<div class="pgrp"><h4>${t}</h4>${body}</div>`:'';
  panel.innerHTML=`
   <div class="phead">
     <span class="meter m-${r.ch}" style="margin-top:5px"><i></i><i></i><i></i></span>
     <div style="min-width:0">
       <h2 id="pTitle">${esc(NAME(r))}</h2>
       <div class="pw">${esc(r.i)} · ${esc(r.ct?r.ct+', ':'')}${esc(r.c)}</div>
     </div>
     <div class="pnav">
       <button class="icb" id="pPrev" type="button" aria-label="Previous">‹</button>
       <button class="icb" id="pNext" type="button" aria-label="Next">›</button>
       <button class="icb star ${isSaved(r)?'on':''}" data-star="${r.id}" type="button" aria-label="Save" style="font-size:16px">★</button>
       <button class="icb" id="pClose" type="button" aria-label="Close">×</button>
     </div>
   </div>
   <div class="pbody">
     <div class="pstat">
       <span class="chip ${costClass(r.cb)}">${esc(r.cb)}</span>
       <span class="chip c-plain">${esc(r.lg)}</span>
       <span class="chip c-plain">${esc(r.pp)}</span>
       ${r.fu&&r.fu!=='Not stated'?`<span class="chip c-plain">Funding: ${esc(r.fu)}</span>`:''}
       ${r.vd?`<span class="chip ${r.vd==='WORTH IT'?'c-free':r.vd==='AVOID'?'c-high':'c-mid'}">${esc(r.vd)}${r.rt?' · '+esc(r.rt):''}</span>`:''}
     </div>
     ${G('Full programme title', (NAME(r)!==r.p ? F('As published', r.p) : ''))}
     ${G('The verdict', F('Why that chance',r.why,1)+F('Recommendation',r.rec,1))}
     ${G('Money', F('What you pay',r.fee,1)+F('Other fees',r.fees2)+F('All-in estimate',r.allin)
        +F('Scholarship',r.sch&&r.sch!=='—'?r.sch:'')+F('Scholarship detail',r.schd))}
     ${G('Getting in', F('Deadline',r.dl,1)+F('Applications open',r.op)+F('Entry requirements',r.entry,1)
        +F('Accepts a non-music degree',r.nm)+F('Portfolio',r.pf)+F('Audition or interview',r.au))}
     ${G('Language', F('Language certificate',r.lgr)+F('English test',r.eng))}
     ${G('The qualification', F('Degree awarded',r.deg)+F('Accreditation',r.acc)+F('Student visa',r.visa)
        +F('Length',r.dur)+F('What you study',r.study)+F('Subject area',r.tr)+F('Found by',r.sw))}
     ${r.src&&r.src.startsWith('http')?`<a class="plink" href="${esc(r.src)}" target="_blank" rel="noopener">Open the official page ↗</a>`:''}
   </div>`;
  panel.classList.add('open'); scrim.classList.add('open'); panel.setAttribute('aria-hidden','false');
  document.getElementById('pClose').onclick=closePanel;
  document.getElementById('pPrev').onclick=()=>step(-1);
  document.getElementById('pNext').onclick=()=>step(1);
  document.getElementById('pClose').focus();
  panel.querySelector('.pbody').scrollTop=0;
}
function step(d){
  if(panelPos<0) return;
  const n=panelPos+d; if(n<0||n>=panelList.length) return;
  panelPos=n; drawPanel(panelList[n]);
}
function closePanel(){
  panel.classList.remove('open'); scrim.classList.remove('open'); panel.setAttribute('aria-hidden','true');
  if(lastFocus&&document.contains(lastFocus)) lastFocus.focus();
}
scrim.onclick=closePanel;

/* ================= events ================= */
function setMode(m){
  mode=m;
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));
  ['picks','explore','saved'].forEach(k=>document.getElementById('v-'+k).hidden=(k!==m));
  document.getElementById('fab').hidden = m!=='explore';
  if(m==='explore') renderExplore(); else if(m==='saved') renderSaved(); else renderPicks();
  writeURL();
  scrollTo({top:0,behavior:'instant'});
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

document.addEventListener('click',e=>{
  const goto=e.target.closest('[data-goto]');
  if(goto){ e.preventDefault(); setMode(goto.dataset.goto); return; }
  const st=e.target.closest('[data-star]');
  if(st){ e.preventDefault(); e.stopPropagation(); toggleSave(RAW[+st.dataset.star]); return; }
  const card=e.target.closest('.card,.row,tbody tr');
  if(card&&card.dataset.id!==undefined){
    lastFocus=card;
    const list = mode==='explore'?current : mode==='saved'?savedRows() : null;
    openId(+card.dataset.id, list);
    return;
  }
  const qvb=e.target.closest('[data-qv]');
  if(qvb){
    const k=qvb.dataset.qv;
    FILTERS.forEach(f=>active[f.k]=new Set());
    qv = (qv===k) ? '' : k;                       // clicking the active view clears it
    if(qv) QV.find(v=>v.k===qv).f();
    shown=50; cursor=-1; renderExplore(); return;
  }
  const more=e.target.closest('#more'); if(more){ shown+=50; renderExplore(); return; }
  const exp=e.target.closest('[data-exp]'); if(exp){ expanded[exp.dataset.exp]=1; renderExplore(); return; }
  const rm=e.target.closest('[data-rm-k]');
  if(rm){ active[rm.dataset.rmK].delete(rm.dataset.rmV); shown=50; renderExplore(); return; }
  if(e.target.closest('[data-rm-q]')){ query=''; document.getElementById('q').value=''; shown=50; renderExplore(); return; }
  if(e.target.closest('#clr')){ FILTERS.forEach(f=>active[f.k]=new Set()); query=''; qv=''; document.getElementById('q').value='';
    shown=50; renderExplore(); return; }
  if(e.target.closest('#railX')||e.target.closest('#fab')){ document.getElementById('rail').classList.toggle('open'); return; }
});
document.addEventListener('change',e=>{
  const lab=e.target.closest('.opt');
  if(lab){ const {k,v}=lab.dataset; e.target.checked?active[k].add(v):active[k].delete(v);
           qv=''; shown=50; cursor=-1; renderExplore(); return; }
  if(e.target.id==='sort'){ sortBy=e.target.value; renderExplore(); }
});
let deb;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(deb);
  deb=setTimeout(()=>{ query=e.target.value.toLowerCase().trim(); shown=50; cursor=-1;
    if(mode!=='explore') setMode('explore'); else renderExplore(); },140);
});
document.getElementById('theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
};

/* keyboard: / focuses search, j/k or arrows move, Enter opens, Esc closes */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(panel.classList.contains('open')) closePanel(); return; }
  if(panel.classList.contains('open')){
    if(e.key==='ArrowRight'){ step(1); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ step(-1); e.preventDefault(); }
    return;
  }
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing){ e.preventDefault(); document.getElementById('q').focus(); return; }
  if(typing||mode!=='explore') return;
  if(e.key==='j'||e.key==='ArrowDown'){ cursor=Math.min(cursor+1,Math.min(shown,current.length)-1); e.preventDefault(); paintCursor(); }
  if(e.key==='k'||e.key==='ArrowUp'){ cursor=Math.max(cursor-1,0); e.preventDefault(); paintCursor(); }
  if(e.key==='Enter'&&cursor>=0){ openId(current[cursor].id,current); }
});
function paintCursor(){
  document.querySelectorAll('.row').forEach((el,i)=>el.classList.toggle('cursor',i===cursor));
  const el=document.querySelectorAll('.row')[cursor];
  if(el) el.scrollIntoView({block:'nearest'});
}
